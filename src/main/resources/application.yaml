spring:
  application:
    name: stock-flow
  datasource:
    url: jdbc:postgresql://localhost:5432/stockflow?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

